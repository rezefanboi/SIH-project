services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - register_data:/data
    env_file:
      - ./backend/.env

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  register_data:

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies and test
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python seed_data.py
        
    - name: Test Docker Compose Build
      run: |
        # Create a sample .env file for the backend
        cp backend/.env.example backend/.env
        
        # Test if the docker images build successfully
        docker compose build
